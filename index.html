<!DOCTYPE html>

    <link rel="icon" type="image/png" href="/assets/img/logo-icon.png" />

    <!-- Normalize CSS -->
    <link

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/global.css" />

  <body>
    <div class="main">
      <header class="header" id="topo">
        <a href="#home">
          <img src="/assets/img/logo.png" alt="" class="logo" />

        <nav class="navbar">
          <div class="menu-icon" id="menuIcon">&#9776;</div>
          <ul class="nav-links" id="navLinks">

        </nav>

      <main>

        <div class="go-top">
          <a href="#topo" id="topo">

                rel="noopener noreferrer"
              >
                <img
                  class="social-midia-img"
                  src="/assets/icons/icons-instagram.png"
                  alt="instagram-logo"
                />
                <span class="social-midia-name"> docesdatiapaula.tradicao</span>
              </a>
            </div>
          </div>
          <hr />

          <div class="contacts-container" id="contato">
            <h1 class="footer-text">Take-away: ligue-nos</h1>
            <!-- <div class="social-midia">
              <a
                href="mailto:docesdatiapaula@gmail.com?subject=Pedido%20de%20Sobremesa&body=Olá,%20gostaria%20de%20fazer%20um%20pedido."

                <img src="/assets/icons/icons-email.png" alt="email" />
                <span class="social-midia-name">
                  docesdatiapaula@gmail.com</span
                >
              </a>
            </div> -->
            <div class="social-midia">
              <a href="tel:+351219219523">
                <img src="/assets/icons/icons-telefone.png" alt="telefone" />
                <span class="social-midia-name">+351 21 921 9523</span>
              </a>
            </div>
          </div>
          <hr />
          <!--TODO Atualizar o link do app para direcionar a pagina do resturante -->

              <h1 class="footer-text">
              Delivery: clique aqui <i class="fa-solid fa-chevron-down"></i>
            </h1>
            <div class="delivery">
              <a
                href="https://www.ubereats.com/pt"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="delivery-icon"
                  src="/assets/icons/uber-eats.svg"
                  alt="uber eats"
                />
              </a>
              <a
                href="https://bolt.eu/pt-pt/food/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="delivery-icon-bolt"
                  src="/assets/icons/bolt-food.svg"
                  alt="bolt food"
                />
              </a>
              <a
                href="https://glovoapp.com"
                target="_blank"
                rel="noopener noreferrer"
